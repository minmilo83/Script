name: Script Codex Auto Indexer

on:
  push:
    paths:
      - 'library/**' # 只有當更動圖書館內容時才觸發

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 賦予機器人寫入檔案的權限
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v3

      - name: 設定 Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # 升級至 18 確保 fs 模組支援最新特性

      - name: 執行掃描腳本
        run: node assets/scripts/indexer.js

      - name: 自動提交更新
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "🤖 MimiBot 回報：已自動更新書架排序與最新日期"
          file_pattern: 'manifest.json library/*/identity.json'
